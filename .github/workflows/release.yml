name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'AlejandroNes/minimg'
    name: Release (${{ matrix.target }})
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.tauri.outputs.releaseId }}
    strategy:
      fail-fast: false
      # Each build merges its platform into the same draft latest.json.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            apple-signing-identity: '-'
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            apple-signing-identity: '-'
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            apple-signing-identity: ''
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate tag and application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          assert.match(process.env.RELEASE_TAG, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag and application version must match');
          assert.equal(config.version, '../package.json');
          assert.equal(config.bundle.createUpdaterArtifacts, true);
          assert.equal(config.plugins.updater.endpoints[0], 'https://github.com/AlejandroNes/minimg/releases/latest/download/latest.json');
          console.log(`Validated ${process.env.RELEASE_TAG}`);
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check TypeScript and metadata
        run: npm run check

      - name: Test frontend and updater
        run: npm test

      - name: Build signed updater artifacts and upload draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc macOS signing; no Apple certificate or notarization credentials.
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple-signing-identity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Minimg v__VERSION__'
          releaseBody: |
            Descarga el instalador correspondiente a tu sistema y arquitectura.
            macOS: firma ad-hoc, sin Developer ID ni notarización; Gatekeeper puede bloquear la apertura.
            Windows: sin firma de código; SmartScreen puede mostrar advertencias.
          releaseDraft: true
          prerelease: false
          # The action adds build and npm's --; the final -- forwards --locked to Cargo.
          tauriScript: 'npm run tauri'
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][setup][ext]'
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 3

  validate-release:
    if: github.repository == 'AlejandroNes/minimg'
    name: Validate complete draft release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate uploaded installers, updater manifest and signatures
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.release.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          retries: 3
          script: |
            const assert = require('node:assert/strict');
            const { readFileSync } = require('node:fs');
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const release_id = Number(process.env.RELEASE_ID);
            assert.ok(Number.isSafeInteger(release_id) && release_id > 0, 'Missing release ID');
            const params = { ...context.repo, release_id };
            const { data: release } = await github.rest.repos.getRelease(params);
            assert.equal(release.tag_name, process.env.RELEASE_TAG);
            assert.equal(release.draft, true, 'Release must remain a draft');
            assert.equal(release.prerelease, false);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...params, per_page: 100,
            });
            const assetNamed = (name) => {
              const matches = assets.filter((asset) => asset.name === name);
              assert.equal(matches.length, 1, `Expected exactly one asset: ${name}`);
              assert.ok(matches[0].size > 0, `Empty asset: ${name}`);
              return matches[0];
            };
            // Draft assets require authenticated API downloads, not public download URLs.
            const downloadText = async (asset) => {
              const { data } = await github.rest.repos.getReleaseAsset({
                ...context.repo, asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              return typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
            };
            const manifest = JSON.parse(await downloadText(assetNamed('latest.json')));
            assert.equal(manifest.version, pkg.version);
            assert.ok(Number.isFinite(Date.parse(manifest.pub_date)), 'Invalid publication date');
            const name = `${config.productName}_${pkg.version}`;
            const platforms = [
              { key: 'darwin-aarch64', stem: `${name}_darwin_aarch64`, installer: 'app', ext: '.app.tar.gz' },
              { key: 'darwin-x86_64', stem: `${name}_darwin_x64`, installer: 'app', ext: '.app.tar.gz' },
              { key: 'windows-x86_64', stem: `${name}_windows_x64`, installer: 'nsis', ext: '-setup.exe' },
            ];
            for (const { key, stem, installer, ext } of platforms) {
              assetNamed(stem + (installer === 'app' ? '.dmg' : '.msi'));
              const updater = assetNamed(stem + ext);
              const signature = (await downloadText(assetNamed(stem + ext + '.sig'))).trim();
              assert.ok(signature, `Missing signature for ${key}`);
              // v1 uses asset API URLs, including when tagName is supplied.
              const expectedUrls = [updater.url, updater.browser_download_url];
              for (const platform of [key, `${key}-${installer}`]) {
                const entry = manifest.platforms?.[platform];
                assert.ok(entry, `Missing updater platform: ${platform}`);
                assert.equal(entry.signature?.trim(), signature, `Signature mismatch: ${platform}`);
                assert.ok(expectedUrls.includes(entry.url), `Wrong updater asset URL: ${platform}`);
              }
              if (installer === 'nsis') {
                const msi = assetNamed(stem + '.msi');
                const msiSignature = (await downloadText(assetNamed(stem + '.msi.sig'))).trim();
                assert.ok(msiSignature, 'Missing MSI signature');
                const entry = manifest.platforms?.[`${key}-msi`];
                assert.ok(entry, 'Missing MSI updater platform');
                assert.equal(entry.signature?.trim(), msiSignature, 'MSI signature mismatch');
                assert.ok([msi.url, msi.browser_download_url].includes(entry.url), 'Wrong MSI asset URL');
              }
              core.info(`Validated installers and uploaded updater signatures for ${key}`);
            }
