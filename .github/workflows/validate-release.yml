name: Validate existing draft release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Existing draft Release ID (read-only validation)'
        required: true
        type: string
        default: '405276548'
      release_tag:
        description: 'Expected release tag'
        required: true
        type: string
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  validate-release:
    if: github.repository == 'AlejandroNes/minimg'
    name: Validate existing draft and assets
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN needs push access to read a draft; the validator only uses GET APIs.
      contents: write
    steps:
      - name: Checkout validator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate existing draft release (no build or upload)
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const validateRelease = require('./scripts/validate-release.cjs');
            await validateRelease({ github, context, core });
